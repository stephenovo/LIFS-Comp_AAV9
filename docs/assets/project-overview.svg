<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">AAV9 SMA virtual-screening overview</title>
  <desc id="desc">A constrained 7-mer library passes through packaging and tropism models to a diverse candidate shortlist.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#10182d"/>
      <stop offset="1" stop-color="#1c3150"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#55d6be"/>
      <stop offset="1" stop-color="#66a3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="1200" height="390" rx="28" fill="url(#bg)"/>
  <circle cx="1110" cy="55" r="130" fill="#66a3ff" opacity="0.08"/>
  <circle cx="80" cy="360" r="165" fill="#55d6be" opacity="0.07"/>

  <text x="600" y="55" fill="#f5f8ff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle">AAV9 capsid design for an SMA application context</text>
  <text x="600" y="84" fill="#aebdd4" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle">A computational funnel from constrained sequence space to testable hypotheses</text>

  <g filter="url(#shadow)">
    <rect x="65" y="125" width="230" height="165" rx="20" fill="#182946" stroke="#3c5577"/>
    <rect x="355" y="125" width="230" height="165" rx="20" fill="#182946" stroke="#3c5577"/>
    <rect x="645" y="125" width="230" height="165" rx="20" fill="#182946" stroke="#3c5577"/>
    <rect x="935" y="125" width="200" height="165" rx="20" fill="#182946" stroke="url(#accent)" stroke-width="2"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="180" y="164" fill="#55d6be" font-size="14" font-weight="700">01 · DESIGN SPACE</text>
    <text x="180" y="201" fill="#f5f8ff" font-size="24" font-weight="700">7-mer library</text>
    <text x="180" y="229" fill="#aebdd4" font-size="15">constrained sampling</text>
    <text x="180" y="252" fill="#aebdd4" font-size="15">+ packaging prior</text>

    <text x="470" y="164" fill="#55d6be" font-size="14" font-weight="700">02 · HARD GATE</text>
    <text x="470" y="201" fill="#f5f8ff" font-size="24" font-weight="700">F_pack</text>
    <text x="470" y="229" fill="#aebdd4" font-size="15">retain viable capsid</text>
    <text x="470" y="252" fill="#aebdd4" font-size="15">hypotheses first</text>

    <text x="760" y="164" fill="#55d6be" font-size="14" font-weight="700">03 · MULTI-TASK</text>
    <text x="760" y="201" fill="#f5f8ff" font-size="22" font-weight="700">CNS ↑  Liver ↓</text>
    <text x="760" y="229" fill="#aebdd4" font-size="15">brain + spinal proxy</text>
    <text x="760" y="252" fill="#aebdd4" font-size="15">off-target penalty</text>

    <text x="1035" y="164" fill="#66a3ff" font-size="14" font-weight="700">04 · SHORTLIST</text>
    <text x="1035" y="201" fill="#f5f8ff" font-size="24" font-weight="700">24–30</text>
    <text x="1035" y="229" fill="#aebdd4" font-size="15">Pareto-diverse</text>
    <text x="1035" y="252" fill="#aebdd4" font-size="15">candidates</text>
  </g>

  <g fill="none" stroke="#6f86a8" stroke-width="3" stroke-linecap="round">
    <path d="M305 207h38"/>
    <path d="M595 207h38"/>
    <path d="M885 207h38"/>
  </g>
  <g fill="#6f86a8">
    <path d="M343 207l-10-7v14z"/>
    <path d="M633 207l-10-7v14z"/>
    <path d="M923 207l-10-7v14z"/>
  </g>

  <rect x="390" y="326" width="420" height="34" rx="17" fill="#fff" opacity="0.08"/>
  <text x="600" y="348" fill="#d8e3f4" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Computational proxy → experimental priority, not clinical proof</text>
</svg>

