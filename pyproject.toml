[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lifs-comp-aav9"
version = "0.1.0"
description = "Multi-task virtual screening scaffold for AAV9 capsid tropism in an SMA application context."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.1,<3",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
models = [
  "lightgbm>=4.3,<5",
  "torch>=2.2,<3",
]
plots = [
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
aav9-sma = "aav9_sma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
